[package]
name = "spica-launcher"
version = "2.6.0"
edition = "2021"
description = "SpicaRustNative Startup Orchestrator, Supervisor, Adaptive Brain Daemon, and Zero-JVM-Overhead Backup Engine for Purpur 1.21.4"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sysinfo = "0.32"
flate2 = "1"
tar = "0.4"
walkdir = "2"
getrandom = "0.2"
