name: SpicaRustNative
version: 2.0.0
main: net.spicanetwork.rustnative.SpicaRustNativePlugin
api-version: '1.21'
description: Purpur 1.21.4 Execution Core + Rust Brain (Zero-copy Spatial Hash/Rayon + spica-launcher IPC)
authors:
  - Spica Network
commands:
  rustbridge:
    description: Spica Rust Bridge durum, Rust Brain, chunk heatmap, tarama ve Java vs Rust MSPT benchmark komutlari.
    usage: /rustbridge <status|brain|chunks|bench|scan|reload>
    permission: SpicaRustNative.admin
permissions:
  SpicaRustNative.admin:
    description: SpicaRustNative yonetim ve benchmark komutlarina erisim.
    default: op
