# SpicaRustNative 2.6.0 (Purpur 1.21.4 Core + Rust Brain + Farm Governor + Surge Guard + Mob Tracking + Redstone/Hopper Governor + Arena Block Diff) Yapilandirmasi
native:
  # 0 = Otomatik (max(2, cekirdek/2), en fazla 8). Main thread + Netty + GC icin bosluk birakir.
  worker-threads: 0

brain:
  # Rust Brain (spica-launcher IPC veya in-process Rust Governor) kontrol dongusunu aktif eder.
  enabled: true
  # -Dspica.ipc.host / -Dspica.ipc.port JVM ozellikleri yoksa kullanilacak yedek IPC adresi.
  # Port 0 birakilirsa yalnizca in-process Rust Brain calisir (standalone mod).
  ipc-fallback-host: "127.0.0.1"
  ipc-fallback-port: 0
  # Kac tick'te bir telemetri toplanip Rust Brain direktifi uygulansin (20 tick = 1 saniye).
  tick-interval: 20
  # Dinamik View/Simulation Distance sinirlari (Minecraft limitleri: 2..32).
  min-view-distance: 5
  max-view-distance: 10
  min-sim-distance: 4
  max-sim-distance: 8
  actuation:
    # Rust Brain direktiflerinin Purpur dunyalarina canli uygulanmasini kontrol eder.
    enabled: true
    # MSPT/EWMA durumuna gore dunya View Distance ve Simulation Distance degerlerini dinamik ayarla.
    dynamic-view-distance: true
    # Yerdeki benzer esyalari Rust Spatial-Hash planlayicisi ile NBT-guvenli birlestir.
    rust-item-merge: true

optimizer:
  # Rust destekli periyodik Entity LOD / AI optimizasyonunu aktif eder.
  enabled: true
  # Kac tick'te bir dunya snapshot'i Rust'a gonderilsin (10 tick = 0.5 saniye idealdir).
  interval-ticks: 10
  # Oyuncuya bu mesafeden yakin moblar tam aktif (LOD_FULL) kalir.
  full-ai-range: 32.0
  # Bu mesafeden uzak moblarin agir pathfinding/AI dongusu guvenli sekilde uyutulur (setAware(false)).
  # Oyuncu yaklasinca veya plugin kapaninca otomatik uyanirlar.
  hibernate-range: 56.0
  # Moblarin birbiriyle carpistigi noktalarda tarama ve uyari esigi (mob farm tespiti).
  cramming-alert-neighbors: 12
  # Isim etiketli (Nametag) moblara dokunma.
  skip-named-mobs: true
  # Evcil (Tamed) hayvanlara dokunma.
  skip-tamed-mobs: true
  # Bu mob turlerinin AI'si asla uyutulmaz.
  excluded-types:
    - VILLAGER
    - WANDERING_TRADER
    - IRON_GOLEM
    - ENDER_DRAGON
    - WITHER
    - WARDEN
    - ELDER_GUARDIAN
    - PLAYER

farm-governor:
  # Rust destekli canli Mob Farm & Koylu (Trading Hall) Governor motorunu aktif eder.
  enabled: true
  # Kac tick'te bir farm yogunlugu ve koylu durumu Rust ile degerlendirilsin (20 tick = 1 saniye).
  interval-ticks: 20
  # Komsu mob yogunlugu hesaplama yaricapi (blok).
  crowd-radius: 3.5
  # Bu komsu sayisina ulasan moblarda carpismayi (pushing) kapatir (setCollidable(false)).
  mild-crowd-threshold: 8
  # Bu komsu sayisina ulasan farm moblarinda carpisma + agir AI'yi baskilar (setAware(false)).
  severe-crowd-threshold: 14
  # Ayni chunk icinde bu siniri asan fazla farm moblarini baskilar.
  chunk-mob-limit: 48
  villager-optimization:
    # Trading Hall ve sikisik koylulerde guvenli AI baskilama + anlik uyanma ozelligi (Y3: varsayilan kapali / opt-in).
    enabled: false
    # Oyuncu bu mesafeye yaklastiginda koylu aninda uyanir (blok).
    wake-range: 8.0
    # Bu sayida koylu bir aradayken veya 1x1 hucreye hapsedilmisse optimize edilir.
    crowd-threshold: 4
    # Oyuncu bir moba/koyluye sag tikladiginda kac saniye boyunca uyanik kalsin (ticaret/ureme/kirkma).
    interact-grace-seconds: 15
    # Koylulerin meslek blogundan stok yenilemesi (restock) icin periyodik uyanma araligi (saniye).
    restock-pulse-interval-seconds: 120
    # Her restock pulse sirasinda koylulerin kac saniye uyanik kalacagi.
    restock-pulse-duration-seconds: 6
  # Isim etiketli (Nametag) moblara dokunma.
  skip-named-mobs: true
  # Evcil (Tamed) hayvanlara dokunma.
  skip-tamed-mobs: true
  # Farm Governor tarafindan asla baskilanmayacak mob turleri.
  # Not: villager-optimization.enabled=true iken VILLAGER bilerek burada degildir (FLAG_VILLAGER ile guvenli yonetilir).
  excluded-types:
    - ENDER_DRAGON
    - WITHER
    - WARDEN
    - ELDER_GUARDIAN

surge-guard:
  # Rust destekli Elytra / Chunk-Yukleme Surge Guard ve Patlama Esya Tamponunu aktif eder.
  enabled: true
  elytra:
    # Yuksek sunucu yukunde veya chunk-yukleme patlamasinda Elytra hizini yumusak sekilde dengeler.
    enabled: true
    # Kac tick'te bir suzulen oyuncularin hizi Rust ile degerlendirilsin (10 tick = 0.5 saniye).
    interval-ticks: 10
    # GREEN durumunda izin verilen temel maksimum Elytra hizi (blok/tick).
    base-max-speed: 1.8
    # Saniyede bu agirlikta chunk yuklenirse (yeni chunk = 2, mevcut chunk = 1) efektif Brain durumu +1 yukseltilir.
    chunk-load-surge-threshold: 40
    # Hiz dengelendiginde oyuncuya (3 saniye bekleme suresiyle) kibar ActionBar bildirimi goster.
    actionbar-warning: true
  explosion:
    # TNT / Creeper / yatak patlamalarindan 1 tick sonra yerdeki esyalari Rust ile NBT-guvenli birlestirir.
    enabled: true
    # Bu sayida veya daha fazla blok kirilan patlamalarda tamponu tetikle.
    min-blocks-trigger: 8
    # Patlama sonrasi esya birlestirme yaricapi (blok).
    merge-radius: 5.0

mob-tracking:
  # Rust destekli canli Mob Gorunurluk & Paket Takip Optimizasyonu (Paper hideEntity/showEntity, ZERO NMS).
  # Gizlenen moblar Purpur'un TrackedEntity.seenBy listesinden duser -> ag paketi ve CPU tasarrufu saglar.
  enabled: true
  # Kac tick'te bir gorunurluk guncellensin (6 tick = 3.3x/sn, titremesiz akici tepki).
  interval-ticks: 6
  # Maksimum mob takip menzili (blok; YELLOW/ORANGE/RED/EMERGENCY altinda dinamik olarak daraltilir).
  max-track-range: 48.0
  # Guvenlik yakin menzili (blok; bu mesafedeki moblar her zaman gorunur kalir).
  safety-near-range: 12.0
  # Maksimum dikey mesafe farki (blok; yeralti magara veya yuksek gokyuzu moblarini gizler).
  max-vertical-delta: 24.0
  # Arka gorunurluk kesme menzili (blok; bu mesafeden uzak ve oyuncunun arkasinda kalan moblar gizlenir).
  rear-cull-range: 16.0
  # Arka gorunurluk dot-product esigi (-0.25 ~= cos(104 derece): oyuncunun tamamen arkasi).
  rear-cull-dot-threshold: -0.25
  # Oyuncu basina maksimum gorunur mob butcesi (Top-K oncelik: dusman moblar ciftlik moblarina onceliklidir).
  max-mobs-per-player: 72
  # Tick basina uygulanacak maksimum hide/show gecis paketi (paket patlamalarini yumusatir).
  max-deltas-per-tick: 512
  # Isim etiketli (Nametag) moblar her zaman gorunur kalir.
  always-visible-named: true
  # Evcil (Tamed) hayvanlar her zaman gorunur kalir.
  always-visible-tamed: true
  # Her zaman gorunur kalacak boss ve kritik mob turleri.
  always-visible-types:
    - ENDER_DRAGON
    - WITHER
    - WARDEN
    - ELDER_GUARDIAN
    - VILLAGER
    - IRON_GOLEM

redstone-governor:
  # Rust destekli canli Redstone & Hopper Lag-Machine Governor motorunu aktif eder.
  enabled: true
  # Guvenli izleme modu (Y4): true iken chunk isisini hesaplar, Top-8 sicak chunklari raporlar ve
  # LOCKDOWN uyarisi verir ama devre/hopper sinyallerini kesmez. Aktif frenleme icin false yapin.
  monitor-only: true
  # Chunk basina saniyelik temel Redstone guncelleme limiti (Brain yuk durumunda otomatik daraltilir).
  redstone-limit-per-sec: 320
  # Chunk basina saniyelik temel Hopper/Envanter esya transfer limiti (Brain yuk durumunda otomatik daraltilir).
  hopper-limit-per-sec: 240
  # Oyuncu tetikleyicilerini (dugme, salter, basinc plakasi, tuzak kancasi) asla kisitlama.
  protect-player-triggers: true
  # Bir chunk LOCKDOWN seviyesine gectiginde konsola uyari yaz (chunk basina 30 saniyede en fazla 1 kez).
  alert-admins-on-lockdown: true
